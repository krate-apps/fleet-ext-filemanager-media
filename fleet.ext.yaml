schema: 1
id: org.fleet.filemanager-media
name: File Manager Media
description: Preview images and run MediaInfo on files under download roots.
version: 1.0.0
api: ">=1.0.0 <2.0.0"
engines:
  - rtorrent
capabilities:
  - files.read
  - files.mediainfo
frontend:
  type: declarative
  entry: ui/extension.json
backend:
  type: process
  executable: bin/filemanager-media-worker
  protocol: jsonrpc-2
